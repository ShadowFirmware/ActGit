<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navegación</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">MiSitio</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav"
                aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="nav nav-tabs" id="mainTab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="home-tab" data-bs-toggle="tab"
                            data-bs-target="#home" type="button" role="tab"
                            aria-controls="home" aria-selected="true">Home</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="profile-tab" data-bs-toggle="tab"
                            data-bs-target="#profile" type="button" role="tab"
                            aria-controls="profile" aria-selected="false">Profile</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="settings-tab" data-bs-toggle="tab"
                            data-bs-target="#settings" type="button" role="tab"
                            aria-controls="settings" aria-selected="false">Settings</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        <div class="tab-content" id="mainTabContent">
            <div class="tab-pane fade show active" id="home" role="tabpanel" aria-labelledby="home-tab">
                <h1>Home</h1>
                <p>Bienvenido a la página principal.</p>
            </div>
            <div class="tab-pane fade" id="profile" role="tabpanel" aria-labelledby="profile-tab">
    <div class="container">
        <!-- Formulario -->
        <div id="formulario-seccion" class="form-container">
            <h2 class="form-title text-center mb-4">
                <i class="fas fa-user-astronaut me-2"></i>Formulario Divertido
            </h2>
            <form id="miFormulario">
                <!-- Nombre -->
                <div class="mb-3">
                    <label for="nombre" class="form-label">¿Cómo te llamas?</label>
                    <input type="text" class="form-control" id="nombre" placeholder="Ej: Juan Pérez" required>
                </div>

                <!-- Última vez que te moriste -->
                <div class="mb-3">
                    <label for="ultimaMuerte" class="form-label">¿Cuándo fue la última vez que te moriste?</label>
                    <input type="text" class="form-control" id="ultimaMuerte" placeholder="Ej: Ayer, en 1999, etc." required>
                </div>

                <!-- ¿Estás vivo? -->
                <div class="mb-3">
                    <label class="form-label">¿Estás vivo?</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="vivo" id="vivoSi" value="Sí" required>
                        <label class="form-check-label" for="vivoSi">Sí</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="vivo" id="vivoNo" value="No">
                        <label class="form-check-label" for="vivoNo">No</label>
                    </div>
                </div>

                <!-- ¿Eres un gato? -->
                <div class="mb-3">
                    <label class="form-label">¿Eres un gato?</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="gato" id="gatoSi" value="Sí" required>
                        <label class="form-check-label" for="gatoSi">Sí</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="gato" id="gatoNo" value="No">
                        <label class="form-check-label" for="gatoNo">No</label>
                    </div>
                </div>

                <!-- Superpoder -->
                <div class="mb-3">
                    <label for="superpoder" class="form-label">¿Cuál es tu superpoder?</label>
                    <input type="text" class="form-control" id="superpoder" placeholder="Ej: Volar, Invisibilidad, etc." required>
                </div>

                <!-- Botón de enviar -->
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="fas fa-paper-plane me-2"></i>Enviar
                    </button>
                </div>
            </form>
        </div>

        <!-- Sección de resultado (oculta al inicio) -->
        <div id="resultado-seccion" class="d-none">
            <div class="card result-card">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0 text-center">
                        <i class="fas fa-check-circle me-2"></i>¡Datos Enviados!
                    </h3>
                </div>
                <div class="card-body">
                    <div id="datos-resultados" class="result-data"></div>
                </div>
                <div class="card-footer text-center">
                    <button id="volver-boton" class="btn btn-outline-primary btn-lg">
                        <i class="fas fa-arrow-left me-2"></i>Volver al formulario
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
            <div class="tab-pane fade" id="settings" role="tabpanel" aria-labelledby="settings-tab">
                <h1>Settings</h1>
                <p>Ajustes y configuración de la aplicación.</p>
                <button class="btn btn-primary" onclick="cambiarColor()">Cambiar color</button>
                
                <div class="row justify-content-center mt-5">

                    <div class="col-12 col-md-8 col-lg-6">

                        <div id="panelDom"
                            class="card shadow-lg text-center p-4">

                            <div class="card-body">

                                <h2 id="tituloDom" class="card-title">
                                    🐱 Panel del DOM
                                </h2>

                                <p id="mensajeDom" class="card-text text-muted">
                                    Pasa el cursor por aquí...
                                </p>

                                <!--
                                    JavaScript agregará el video aquí
                                -->
                                <div id="contenidoDom">

                                    <span class="fs-1">
                                        👀
                                    </span>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>
            </div>
        </div>
    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>
</html>
